name: "🦈 SharkIA API Server"

# Disparo manual pelo GitHub (botão "Run workflow")
on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Horas para manter a API online (máx 6)"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

jobs:
  run-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 horas máximo do GitHub Actions

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      # 1. Baixar código
      - name: "📥 Checkout do código"
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: "🐍 Configurar Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Instalar dependências
      - name: "📦 Instalar dependências"
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      # 4. Instalar cloudflared (túnel gratuito)
      - name: "🌐 Instalar Cloudflare Tunnel"
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      # 5. Iniciar a API em background
      - name: "🚀 Iniciar SharkIA API"
        run: |
          echo "🦈 Iniciando SharkIA API..."
          nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          echo "⏳ Aguardando API iniciar..."
          
          # Aguardar até a API responder (máx 5 minutos)
          for i in $(seq 1 60); do
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ API respondendo!"
              break
            fi
            echo "   Tentativa $i/60..."
            sleep 5
          done
          
          # Verificar se a API subiu
          if ! curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "❌ API não iniciou! Logs:"
            cat api.log
            exit 1
          fi
          
          curl -s http://localhost:8000/health | python -m json.tool

      # 6. Criar túnel público
      - name: "🌍 Criar túnel público"
        run: |
          echo "🔗 Criando túnel Cloudflare..."
          nohup cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          # Aguardar URL do túnel aparecer
          sleep 10
          
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "⏳ Aguardando túnel..."
            sleep 10
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1)
          fi
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "❌ Túnel não criado! Logs:"
            cat tunnel.log
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "🦈 SharkIA API está ONLINE!"
          echo "=========================================="
          echo ""
          echo "🌍 URL PÚBLICA: $TUNNEL_URL"
          echo ""
          echo "📋 Endpoints disponíveis:"
          echo "   GET  $TUNNEL_URL/health"
          echo "   GET  $TUNNEL_URL/docs"
          echo "   POST $TUNNEL_URL/classificar"
          echo "   POST $TUNNEL_URL/confirmar"
          echo "   POST $TUNNEL_URL/buscar"
          echo "   GET  $TUNNEL_URL/pendentes"
          echo ""
          echo "📖 Documentação interativa (Swagger):"
          echo "   $TUNNEL_URL/docs"
          echo ""
          echo "⏰ A API ficará online por ${{ inputs.duration_hours }} hora(s)"
          echo "=========================================="
          
          # Salvar URL para referência
          echo "$TUNNEL_URL" > tunnel_url.txt

      # 7. Manter online pelo tempo solicitado
      - name: "⏰ Manter API online (${{ inputs.duration_hours }}h)"
        run: |
          HOURS=${{ inputs.duration_hours }}
          TOTAL_SECONDS=$((HOURS * 3600))
          INTERVAL=300  # Log a cada 5 min
          ELAPSED=0
          
          TUNNEL_URL=$(cat tunnel_url.txt)
          
          echo "🦈 API online em: $TUNNEL_URL"
          echo "⏰ Mantendo por ${HOURS}h (${TOTAL_SECONDS}s)..."
          echo ""
          
          while [ $ELAPSED -lt $TOTAL_SECONDS ]; do
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
            REMAINING=$(( (TOTAL_SECONDS - ELAPSED) / 60 ))
            
            # Verificar se API ainda está viva
            if curl -s http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ [$(date '+%H:%M:%S')] API ativa - ${REMAINING} min restantes"
            else
              echo "⚠️  [$(date '+%H:%M:%S')] API caiu! Reiniciando..."
              nohup uvicorn src.api.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
              sleep 30
            fi
          done
          
          echo ""
          echo "⏰ Tempo expirado. API sendo desligada."
          echo "🔄 Para reiniciar, execute o workflow novamente."
